x-app: &app
  image: customer-support-ai:local
  build: .
  environment: &environment
    APP_ENV: production
    DATABASE_URL: sqlite:////app/runtime/dev.db
    KNOWLEDGE_BASE_DIR: data/knowledge_base
    AI_MODE: ${AI_MODE:-offline}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  volumes:
    - support-data:/app/runtime

services:
  migrate:
    <<: *app
    command: ["uv", "run", "--no-sync", "python", "scripts/migrate_database.py"]
  support-ai:
    <<: *app
    ports:
      - "127.0.0.1:${SUPPORT_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  support-data:
