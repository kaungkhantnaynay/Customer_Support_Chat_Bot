previews:
  generation: off

projects:
  - name: BeanCo
    environments:
      - name: Production
        services:
          - type: web
            name: beanco-support-api
            runtime: docker
            region: singapore
            plan: free
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            envVars:
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                sync: false
              - key: KNOWLEDGE_BASE_DIR
                value: data/knowledge_beanco
              - key: LOG_LEVEL
                value: INFO
              - key: ADMIN_USERNAME
                value: admin
              - key: ADMIN_PASSWORD
                generateValue: true
              - key: SUPPORT_API_TOKEN
                generateValue: true
              - key: AI_MODE
                value: offline
              - key: VECTOR_STORE
                value: local
