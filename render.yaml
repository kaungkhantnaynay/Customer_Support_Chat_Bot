previews:
  generation: off

projects:
  - name: BeanCo
    environments:
      - name: Production
        services:
          - type: web
            name: beanco-support-api
            runtime: docker
            region: singapore
            plan: 0.5c-512mb
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            preDeployCommand: uv run --no-sync python scripts/migrate_database.py
            maxShutdownDelaySeconds: 30
            envVars:
              - key: APP_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: beanco-support-db
                  property: connectionString
              - key: KNOWLEDGE_BASE_DIR
                value: data/knowledge_beanco
              - key: LOG_LEVEL
                value: INFO
              - key: ADMIN_USERNAME
                value: admin
              - key: ADMIN_PASSWORD
                generateValue: true
              - key: SUPPORT_API_TOKEN
                generateValue: true
              - key: AI_MODE
                value: offline
              - key: VECTOR_STORE
                value: local
        databases:
          - name: beanco-support-db
            region: singapore
            plan: 0.1c-256mb
            postgresMajorVersion: "18"
            databaseName: beanco_support
            user: beanco_support
            ipAllowList: []
